name: ai-business-automation

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-latest}
    container_name: n8n
    restart: unless-stopped
    ports:
      # Exposé uniquement sur la machine locale.
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY manquant dans .env}
      - GENERIC_TIMEZONE=${TIMEZONE:-Europe/Paris}
      - TZ=${TIMEZONE:-Europe/Paris}
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_SECURE_COOKIE=false
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      # Les nodes de lecture de fichiers n'ont accès qu'à /data.
      - N8N_RESTRICT_FILE_ACCESS_TO=/data
      # Valeurs lisibles depuis les workflows via $env.
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - LLM_BASE_URL=http://omniroute:20128/v1
      - LLM_MODEL=${LLM_MODEL}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./prompts:/data/prompts:ro
      - ./data:/data/samples:ro
      - ./workflows:/data/workflows
    depends_on:
      - omniroute

  omniroute:
    image: diegosouzapw/omniroute:${OMNIROUTE_VERSION:-latest}
    container_name: omniroute
    restart: unless-stopped
    ports:
      # Dashboard d'administration, exposé uniquement sur la machine locale.
      # n8n passe par le réseau Docker interne (http://omniroute:20128).
      - "127.0.0.1:20128:20128"
    environment:
      - PORT=20128
      - DATA_DIR=/app/data
      - NODE_ENV=production
      - JWT_SECRET=${OMNIROUTE_JWT_SECRET:?OMNIROUTE_JWT_SECRET manquant dans .env}
      - API_KEY_SECRET=${OMNIROUTE_API_KEY_SECRET:?OMNIROUTE_API_KEY_SECRET manquant dans .env}
      - INITIAL_PASSWORD=${OMNIROUTE_INITIAL_PASSWORD:?OMNIROUTE_INITIAL_PASSWORD manquant dans .env}
      - STORAGE_ENCRYPTION_KEY=${OMNIROUTE_STORAGE_ENCRYPTION_KEY:-}
      # Joignable depuis le conteneur n8n : une clé API est donc exigée.
      - REQUIRE_API_KEY=true
    volumes:
      - omniroute_data:/app/data

volumes:
  n8n_data:
  omniroute_data:
